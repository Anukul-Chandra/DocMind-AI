[project]
name = "llm-gateway"
version = "0.1.0"
description = "Reusable LLM gateway — provider contracts, failover, model pool, cooldown, failure policy, catalog, and OpenAI-compatible providers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]
